<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Video Room</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background-glow glow-1"></div>
    <div class="background-glow glow-2"></div>

    <main class="page">

        <header class="header">

            <div class="logo">
                VIDEO<span>ROOM</span>
            </div>

            <div class="online">
                <span class="online-dot"></span>
                <span id="onlineCount">0</span> онлайн
            </div>

        </header>


        <section class="video-container">

            <div class="video-wrapper">

                <video
                    id="video"
                    controls
                    playsinline
                    preload="metadata"
                >
                    <source
                        src="videos/video.mp4"
                        type="video/mp4"
                    >

                    Ваш браузер не поддерживает
                    воспроизведение видео.
                </video>

            </div>


            <div class="video-info">

                <div>
                    <h1 id="videoTitle">
                        Сейчас смотрим
                    </h1>

                    <p>
                        Управление воспроизведением
                        синхронизировано для всех участников
                    </p>
                </div>

                <div
                    id="syncStatus"
                    class="sync-status"
                >
                    Синхронизация...
                </div>

            </div>

        </section>


        <footer class="footer">
            <span>VIDEO ROOM</span>
            <span>•</span>
            <span>Синхронный просмотр</span>
        </footer>

    </main>


    <script type="module" src="app.js"></script>

</body>
                                          </html>
